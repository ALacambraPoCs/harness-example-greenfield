# Ciclo de vida de tareas (N1): valida tareas y PR, verifica la aceptación de las tareas que pasan a done
# (ADR-016) y refleja el estado en las issues enlazadas (X-01). Marca como checks requeridos
# "tasks / harness tasks" y "tasks / puerta riesgo alto" (se salta salvo en riesgo alto, ADR-010 rev. 2).
name: harness-tasks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tasks:
    uses: ALacambraPoCs/harness-standard-lab/.github/workflows/harness-tasks-lifecycle.yml@cli-v0.9.2-rc.1
    with:
      standard-repository: ALacambraPoCs/harness-standard-lab
      cli-ref: cli-v0.9.2-rc.1
    permissions:
      contents: read
      pull-requests: read
      issues: write
